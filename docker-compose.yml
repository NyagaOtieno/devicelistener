services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devicelistener
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: api
    env_file: .env
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/devicelistener?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  gt06-listener:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: gt06-listener
    env_file: .env
    environment:
      GT06_TCP_ADDR: ":9001"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/devicelistener?sslmode=disable"
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy

  uniguard-listener:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: uniguard-listener
    env_file: .env
    environment:
      UNIGUARD_TCP_ADDR: ":9002"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/devicelistener?sslmode=disable"
    ports:
      - "9002:9002"
    depends_on:
      postgres:
        condition: service_healthy

  teltonika-listener:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: teltonika-listener
    env_file: .env
    environment:
      TELTONIKA_TCP_ADDR: ":9003"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/devicelistener?sslmode=disable"
    ports:
      - "9003:9003"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
